services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: recipes
      PGUSER: recipes
      PGPASSWORD: recipes
    volumes:
      - ./data/recipe_pdfs:/app/data/recipe_pdfs
      - ./results:/app/results
    stdin_open: true
    tty: true

volumes:
  pgdata:
